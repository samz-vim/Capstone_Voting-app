name: CD

on:
  repository_dispatch:
    types: [terraform-complete]
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy NationalVote
    runs-on: ubuntu-latest

    env:
      AWS_REGION: eu-north-1
      AWS_PAGER: ""
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

     
     
      - name: Discover Current EC2 Instance
        id: ec2
        shell: bash
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail

          if [[ -z "${AWS_REGION:-}" ]]; then
            echo "::error::AWS_REGION secret is missing."
            exit 1
          fi

          echo "Searching for the current NationalVote EC2 instance..."

          INSTANCE_ID=$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --filters \
              "Name=tag:Project,Values=NationalVote" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)

          if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "None" ]]; then
            echo "::error::No running NationalVote EC2 instance found."
            echo "Run Terraform apply and check the EC2 tags and AWS region."
            exit 1
          fi

          INSTANCE_COUNT=$(wc -w <<< "$INSTANCE_ID")

          if [[ "$INSTANCE_COUNT" -ne 1 ]]; then
            echo "::error::Found multiple running NationalVote instances. Expected exactly one."
            exit 1
          fi

          PUBLIC_IP=$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)

          if [[ -z "$PUBLIC_IP" || "$PUBLIC_IP" == "None" ]]; then
            echo "::error::The current EC2 instance has no public IP."
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "host=$PUBLIC_IP" >> "$GITHUB_OUTPUT"

          echo "EC2 instance discovered successfully."
          echo "Instance ID: $INSTANCE_ID"
          echo "Public IP: $PUBLIC_IP"


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      
      
      - name: Verify Kubernetes manifests
        shell: bash
        run: |
          set -euo pipefail
          pwd
          ls -la
          ls -la k8s/
          test -f k8s/namespace.yml
          test -f k8s/deployment.yml
          test -f k8s/service.yml
          echo "All Kubernetes manifests found."

      
      - name: Copy Kubernetes manifests to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "k8s/*.yml"
          target: "/home/ubuntu/nationalvote-kubernetes/"
          strip_components: 1
          overwrite: true
      

      
      - name: Check EC2 resources and K3s
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          command_timeout: 3m
          script: |
            echo "===== MEMORY ====="
            free -h
      
            echo "===== DISK ====="
            df -h /
      
            echo "===== CPU LOAD ====="
            uptime
            nproc
      
            echo "===== MEMORY-HEAVY PROCESSES ====="
            ps -eo pid,comm,%mem,%cpu --sort=-%mem | head -10
      
            echo "===== K3S STATUS ====="
            sudo systemctl is-active k3s || true
      
            echo "===== API HEALTH ====="
            sudo timeout 15 /usr/local/bin/k3s kubectl \
              --request-timeout=10s get nodes -o wide || true
      
            echo "===== RECENT ERRORS ====="
            sudo timeout 15 journalctl -u k3s \
              -p err -n 15 --no-pager || true

      
      - name: Diagnose EC2 and K3s health
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            echo "===== INSTANCE RESOURCES ====="
            uptime
            free -h
            df -h /
            nproc
      
            echo "===== TOP PROCESSES BY MEMORY ====="
            ps aux --sort=-%mem | head -12
      
            echo "===== K3S SERVICE ====="
            sudo systemctl status k3s --no-pager -l || true
      
            echo "===== CONTAINER RUNTIME ====="
            sudo k3s crictl info 2>&1 | head -60 || true
      
            echo "===== RECENT K3S ERRORS ====="
            sudo journalctl -u k3s -n 60 --no-pager

      
      - name: Test Docker on existing EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -eu
      
            if ! command -v docker >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y docker.io
            fi
      
            sudo systemctl enable --now docker
            sudo docker --version
            sudo docker run --rm hello-world


      
      - name: Check Docker on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          command_timeout: 1m
          script: |
            set -eu
      
            if ! command -v docker >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y docker.io
            fi
      
            sudo systemctl enable --now docker
            sudo docker --version
            sudo docker run --rm hello-world
      
      - name: Install or Repair K3s
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          command_timeout: 8m
          script: |
            set -eu
      
            echo "Checking whether K3s is already installed..."
      
            if sudo systemctl is-active --quiet k3s; then
              echo "K3s is already running."
            else
              echo "K3s is missing or stopped. Checking package manager..."
      
              if ! sudo timeout 60 apt-get \
                -o DPkg::Lock::Timeout=45 update; then
                echo "ERROR: apt is locked or package update failed."
                ps aux | grep -E '[a]pt-get|[d]pkg' || true
                exit 1
              fi
      
              sudo timeout 90 apt-get \
                -o DPkg::Lock::Timeout=60 install -y curl ca-certificates
      
              echo "Installing lightweight Kubernetes..."
              curl -fsSL https://get.k3s.io -o /tmp/install-k3s.sh
              sudo env INSTALL_K3S_CHANNEL=stable sh /tmp/install-k3s.sh
      
              echo "Checking K3s service..."
              if ! sudo systemctl is-active --quiet k3s; then
                sudo systemctl status k3s --no-pager || true
                sudo journalctl -u k3s -n 60 --no-pager || true
                exit 1
              fi
            fi
      
            echo "Configuring kubectl..."
            sudo install -d -o ubuntu -g ubuntu -m 700 /home/ubuntu/.kube
            sudo install -o ubuntu -g ubuntu -m 600 \
              /etc/rancher/k3s/k3s.yaml \
              /home/ubuntu/.kube/config
      
            export KUBECONFIG=/home/ubuntu/.kube/config
      
            echo "Waiting up to 90 seconds for Kubernetes..."
            if ! sudo k3s kubectl wait \
              --for=condition=Ready nodes --all --timeout=75s; then
              sudo journalctl -u k3s -n 80 --no-pager || true
              exit 1
            fi
      
            sudo touch /var/lib/nationalvote-bootstrap-complete
            sudo chown ubuntu:ubuntu /home/ubuntu/.kube/config
      
            kubectl get nodes
            echo "SUCCESS: K3s is ready."
         
      - name: Preflight - Check Kubernetes health
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            set -eu
      
            echo "Checking K3s service..."
      
            if ! sudo systemctl is-active --quiet k3s; then
              echo "ERROR: K3s is not running. Stopping early."
              sudo systemctl status k3s --no-pager || true
              sudo journalctl -u k3s -n 60 --no-pager || true
              sudo tail -n 60 /var/log/nationalvote-bootstrap.log || true
              exit 1
            fi
      
            echo "Checking Kubernetes configuration..."
      
            if [ ! -r /home/ubuntu/.kube/config ]; then
              echo "ERROR: Kubernetes config is missing."
              sudo tail -n 60 /var/log/nationalvote-bootstrap.log || true
              exit 1
            fi
      
            export KUBECONFIG=/home/ubuntu/.kube/config
      
            echo "Checking node readiness (maximum 60 seconds)..."
      
            if ! kubectl wait \
              --for=condition=Ready nodes --all \
              --timeout=60s; then
              echo "ERROR: Kubernetes node is not Ready."
              kubectl get nodes -o wide || true
              kubectl get pods -A || true
              sudo journalctl -u k3s -n 60 --no-pager || true
              exit 1
            fi
      
            echo "SUCCESS: Kubernetes is ready for deployment."
            kubectl get nodes

      
      - name: Debug and verify Kubernetes files
        shell: bash
        run: |
          set -euxo pipefail
          echo "Repository root:"
          pwd
          echo "Kubernetes files:"
          find . -maxdepth 4 -type f \( -iname '*.yml' -o -iname '*.yaml' \) | sort
          test -f k8s/namespace.yml
          test -f k8s/deployment.yml
          test -f k8s/service.yml
      
      - name: Capture EC2 public IP from Terraform
        id: tf_outputs
        working-directory: ./terraform
        shell: bash
        run: |
          set -euo pipefail
          EC2_IP=$(terraform output -raw ec2_public_ip)
          if [ -z "$EC2_IP" ]; then
            echo "::error::Terraform returned an empty EC2 public IP"
            exit 1
          fi
          echo "ec2_host=$EC2_IP" >> "$GITHUB_OUTPUT"
          echo "Successfully captured the EC2 public IP."

          


      - name: Copy Kubernetes manifests to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "k8s/namespace.yml,k8s/deployment.yml,k8s/service.yml"
          target: "/home/ubuntu/nationalvote-kubernetes/"
          strip_components: 1
          overwrite: true

      
      - name: Check EC2 host configuration
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          if [ -z "$EC2_HOST" ]; then
            echo "::error::EC2_HOST is empty or the secret is unavailable."
            exit 1
          fi
          echo "EC2_HOST is configured."

      
            
      - name: Copy Helm chart to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.tf_outputs.outputs.ec2_host }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "helm/Chart.yaml,helm/values.yaml,helm/templates/deployment.yaml,helm/templates/service.yaml"
          target: "/home/ubuntu/nationalvote-helm/"
          strip_components: 1
          overwrite: true

          
      - name: Deploy NationalVote to Kubernetes
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          command_timeout: 4m
          script: |
            set -e
            cd /home/ubuntu/nationalvote-kubernetes
          
            echo "Creating namespace..."
            sudo k3s kubectl apply -f namespace.yml
          
            echo "Deploying NationalVote..."
            sudo k3s kubectl apply -f deployment.yml
          
            echo "Creating service..."
            sudo k3s kubectl apply -f service.yml
          
            echo "Checking resources..."
            sudo k3s kubectl get all -n voting-app
            
      - name: Deploy NationalVote using Helm
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG,DOCKERHUB_USERNAME
          script: |
            set -eu

            echo "Installing Helm if required..."
            if ! command -v helm >/dev/null 2>&1; then
              curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 \
                -o /tmp/get_helm.sh
              sudo bash /tmp/get_helm.sh
            fi

            helm version

            cd /home/ubuntu/nationalvote-helm

            echo "Validating chart..."
            helm lint .

            echo "Checking K3s..."
            sudo k3s kubectl get nodes

            echo "Preparing first Helm installation..."
            if ! sudo env KUBECONFIG=/etc/rancher/k3s/k3s.yaml \
              helm status nationalvote -n voting-app >/dev/null 2>&1; then
              sudo k3s kubectl delete deployment nationalvote \
                -n voting-app --ignore-not-found
              sudo k3s kubectl delete service nationalvote-service \
                -n voting-app --ignore-not-found
            fi

            echo "Deploying image ${DOCKERHUB_USERNAME}/nationalvote:${IMAGE_TAG}"

            sudo env KUBECONFIG=/etc/rancher/k3s/k3s.yaml \
              helm upgrade --install nationalvote . \
              --namespace voting-app \
              --create-namespace \
              --set image.repository="${DOCKERHUB_USERNAME}/nationalvote" \
              --set-string image.tag="${IMAGE_TAG}" \
              --wait \
              --timeout 180s

            echo "Checking Helm release..."
            sudo env KUBECONFIG=/etc/rancher/k3s/k3s.yaml \
              helm status nationalvote -n voting-app

            echo "Checking application..."
            sudo k3s kubectl rollout status deployment/nationalvote \
              -n voting-app --timeout=180s

            sudo k3s kubectl get pods -n voting-app
            sudo k3s kubectl get services -n voting-app
