name: CD

on:
  repository_dispatch:
    types: [terraform-complete]
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy NationalVote
    runs-on: ubuntu-latest

    env:
      AWS_REGION: eu-north-1
      AWS_PAGER: ""
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

     
     
      - name: Discover Current EC2 Instance
        id: ec2
        shell: bash
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail

          if [[ -z "${AWS_REGION:-}" ]]; then
            echo "::error::AWS_REGION secret is missing."
            exit 1
          fi

          echo "Searching for the current NationalVote EC2 instance..."

          INSTANCE_ID=$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --filters \
              "Name=tag:Project,Values=NationalVote" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)

          if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "None" ]]; then
            echo "::error::No running NationalVote EC2 instance found."
            echo "Run Terraform apply and check the EC2 tags and AWS region."
            exit 1
          fi

          INSTANCE_COUNT=$(wc -w <<< "$INSTANCE_ID")

          if [[ "$INSTANCE_COUNT" -ne 1 ]]; then
            echo "::error::Found multiple running NationalVote instances. Expected exactly one."
            exit 1
          fi

          PUBLIC_IP=$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)

          if [[ -z "$PUBLIC_IP" || "$PUBLIC_IP" == "None" ]]; then
            echo "::error::The current EC2 instance has no public IP."
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "host=$PUBLIC_IP" >> "$GITHUB_OUTPUT"

          echo "EC2 instance discovered successfully."
          echo "Instance ID: $INSTANCE_ID"
          echo "Public IP: $PUBLIC_IP"


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      
      - name: Verify Kubernetes manifests
        shell: bash
        run: |
          set -euo pipefail
          pwd
          ls -la
          ls -la k8s/
          test -f k8s/namespace.yaml
          test -f k8s/deployment.yaml
          test -f k8s/service.yaml
      
          echo "All Kubernetes manifests exist."
      
      - name: Copy Kubernetes manifests to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "k8s/*.yaml"
          target: "/home/ubuntu/nationalvote-kubernetes/"
          strip_components: 1
          overwrite: true
      

      
      - name: Diagnose EC2 Bootstrap Failure
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          command_timeout: 3m
          script: |
            echo "========== CLOUD-INIT STATUS =========="
            sudo cloud-init status --long || true
      
            echo "========== SCRIPT FILE TYPE =========="
            sudo file /var/lib/cloud/instance/scripts/part-001 || true
      
            echo "========== FIRST 32 BYTES =========="
            sudo od -An -tx1 -N32 /var/lib/cloud/instance/scripts/part-001 || true
      
            echo "========== FIRST LINE WITH HIDDEN CHARACTERS =========="
            sudo head -n 1 /var/lib/cloud/instance/scripts/part-001 | cat -A || true
      
            echo "========== BOOTSTRAP LOG =========="
            sudo tail -n 150 /var/log/nationalvote-bootstrap.log 2>&1 || true
      
            echo "========== CLOUD-INIT OUTPUT =========="
            sudo tail -n 200 /var/log/cloud-init-output.log 2>&1 || true
      
            echo "========== CLOUD-INIT ERROR DETAILS =========="
            sudo sed -n '830,875p' /var/log/cloud-init.log 2>&1 || true
      
            echo "========== INSTALLED COMPONENTS =========="
            command -v kubectl || true
            command -v kubeadm || true
            command -v containerd || true
    
          
      
      - name: Test Docker on existing EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -eu
      
            if ! command -v docker >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y docker.io
            fi
      
            sudo systemctl enable --now docker
            sudo docker --version
            sudo docker run --rm hello-world


      
      - name: Check Docker on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          command_timeout: 1m
          script: |
            set -eu
      
            if ! command -v docker >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y docker.io
            fi
      
            sudo systemctl enable --now docker
            sudo docker --version
            sudo docker run --rm hello-world
      
      - name: Install or Repair K3s
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          command_timeout: 8m
          script: |
            set -eu
      
            echo "Checking whether K3s is already installed..."
      
            if sudo systemctl is-active --quiet k3s; then
              echo "K3s is already running."
            else
              echo "K3s is missing or stopped. Checking package manager..."
      
              if ! sudo timeout 60 apt-get \
                -o DPkg::Lock::Timeout=45 update; then
                echo "ERROR: apt is locked or package update failed."
                ps aux | grep -E '[a]pt-get|[d]pkg' || true
                exit 1
              fi
      
              sudo timeout 90 apt-get \
                -o DPkg::Lock::Timeout=60 install -y curl ca-certificates
      
              echo "Installing lightweight Kubernetes..."
              curl -fsSL https://get.k3s.io -o /tmp/install-k3s.sh
              sudo env INSTALL_K3S_CHANNEL=stable sh /tmp/install-k3s.sh
      
              echo "Checking K3s service..."
              if ! sudo systemctl is-active --quiet k3s; then
                sudo systemctl status k3s --no-pager || true
                sudo journalctl -u k3s -n 60 --no-pager || true
                exit 1
              fi
            fi
      
            echo "Configuring kubectl..."
            sudo install -d -o ubuntu -g ubuntu -m 700 /home/ubuntu/.kube
            sudo install -o ubuntu -g ubuntu -m 600 \
              /etc/rancher/k3s/k3s.yaml \
              /home/ubuntu/.kube/config
      
            export KUBECONFIG=/home/ubuntu/.kube/config
      
            echo "Waiting up to 90 seconds for Kubernetes..."
            if ! sudo k3s kubectl wait \
              --for=condition=Ready nodes --all --timeout=75s; then
              sudo journalctl -u k3s -n 80 --no-pager || true
              exit 1
            fi
      
            sudo touch /var/lib/nationalvote-bootstrap-complete
            sudo chown ubuntu:ubuntu /home/ubuntu/.kube/config
      
            kubectl get nodes
            echo "SUCCESS: K3s is ready."
         
      - name: Preflight - Check Kubernetes health
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            set -eu
      
            echo "Checking K3s service..."
      
            if ! sudo systemctl is-active --quiet k3s; then
              echo "ERROR: K3s is not running. Stopping early."
              sudo systemctl status k3s --no-pager || true
              sudo journalctl -u k3s -n 60 --no-pager || true
              sudo tail -n 60 /var/log/nationalvote-bootstrap.log || true
              exit 1
            fi
      
            echo "Checking Kubernetes configuration..."
      
            if [ ! -r /home/ubuntu/.kube/config ]; then
              echo "ERROR: Kubernetes config is missing."
              sudo tail -n 60 /var/log/nationalvote-bootstrap.log || true
              exit 1
            fi
      
            export KUBECONFIG=/home/ubuntu/.kube/config
      
            echo "Checking node readiness (maximum 60 seconds)..."
      
            if ! kubectl wait \
              --for=condition=Ready nodes --all \
              --timeout=60s; then
              echo "ERROR: Kubernetes node is not Ready."
              kubectl get nodes -o wide || true
              kubectl get pods -A || true
              sudo journalctl -u k3s -n 60 --no-pager || true
              exit 1
            fi
      
            echo "SUCCESS: Kubernetes is ready for deployment."
            kubectl get nodes

      - name: Copy Kubernetes manifests to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "kubernetes/*.yaml"
          target: "/home/ubuntu/nationalvote-kubernetes/"
          strip_components: 1
          overwrite: true
           
      - name: Deploy NationalVote to Kubernetes
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          command_timeout: 4m
          script: |
            set -eu
      
            export KUBECONFIG=/home/ubuntu/.kube/config
            cd /home/ubuntu/nationalvote-kubernetes
      
            echo "Creating namespace..."
            kubectl apply -f namespace.yaml
      
            echo "Deploying NationalVote..."
            kubectl apply -f deployment.yaml
            kubectl apply -f service.yaml
      
            echo "Waiting up to 120 seconds for the application..."
            if ! kubectl rollout status deployment/nationalvote \
              -n devops-project --timeout=120s; then
              echo "ERROR: NationalVote rollout failed."
              kubectl get pods -n devops-project -o wide || true
              kubectl describe deployment nationalvote \
                -n devops-project || true
              kubectl get events -n devops-project \
                --sort-by=.metadata.creationTimestamp || true
              exit 1
            fi
      
            echo "Deployment successful."
            kubectl get pods,deployments,services \
              -n devops-project
