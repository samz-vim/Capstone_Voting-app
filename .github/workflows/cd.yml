
name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push NationalVote image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}:sha-${{ github.sha }}

      - name: Copy Kubernetes manifests to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "k8s/"
          target: "/home/ubuntu/nationalvote-deploy/"

      - name: Deploy to Kubernetes over SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}:sha-${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE
          script: |
            set -eu

            echo "Checking Kubernetes cluster..."
            kubectl get nodes

            echo "Applying NationalVote manifests..."
            kubectl apply -f /home/ubuntu/nationalvote-deploy/k8s/

            echo "Updating NationalVote image..."
            kubectl set image deployment/nationalvote \
              nationalvote="$IMAGE" \
              -n devops-project

            echo "Waiting for deployment..."
            kubectl rollout status deployment/nationalvote \
              -n devops-project --timeout=300s

            echo "Checking application pods..."
            kubectl get pods -n devops-project
            kubectl get svc -n devops-project
