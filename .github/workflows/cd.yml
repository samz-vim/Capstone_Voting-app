
name: CD

on:
  repository_dispatch:
    types: [terraform-complete]
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push NationalVote image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}:sha-${{ github.sha }}

    
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Get EC2 public IP
        id: ec2
        shell: bash
        env:
          AWS_PAGER: ""
        run: |
          IP=$(aws ec2 describe-instances \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
      
          if [ -z "$IP" ] || [ "$IP" = "None" ]; then
            echo "EC2 has no public IP, or the instance ID is incorrect."
            exit 1
          fi
      
          echo "host=$IP" >> "$GITHUB_OUTPUT"
      

          script: |
            set -eu

            echo "Checking Kubernetes cluster..."
            kubectl get nodes

            echo "Applying NationalVote manifests..."
            kubectl apply -f /home/ubuntu/nationalvote-deploy/k8s/

            echo "Updating NationalVote image..."
            kubectl set image deployment/nationalvote \
              nationalvote="$IMAGE" \
              -n devops-project

            echo "Waiting for deployment..."
            kubectl rollout status deployment/nationalvote \
              -n devops-project --timeout=300s

            echo "Checking application pods..."
            kubectl get pods -n devops-project
            kubectl get svc -n devops-project
