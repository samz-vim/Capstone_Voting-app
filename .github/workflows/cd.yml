name: CD

on:
  repository_dispatch:
    types: [terraform-complete]
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy NationalVote
    runs-on: ubuntu-latest

    env:
      AWS_REGION: eu-north-1
      AWS_PAGER: ""
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get EC2 public IP
        id: ec2
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          if [ -z "$INSTANCE_ID" ]; then
            echo "EC2_INSTANCE_ID secret is missing."
            exit 1
          fi

          IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)

          if [ -z "$IP" ] || [ "$IP" = "None" ]; then
            echo "No public IP found. Check the EC2 instance and region."
            exit 1
          fi

          echo "host=$IP" >> "$GITHUB_OUTPUT"
          echo "EC2 address discovered successfully."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Copy Kubernetes manifests to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "k8s/"
          target: "/home/ubuntu/nationalvote-deploy/"
          overwrite: true

      - name: Deploy application through SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE
          script: |
            set -e

            echo "Checking Kubernetes cluster..."
            sudo kubectl get nodes

            echo "Applying NationalVote manifests..."
            sudo kubectl apply -f /home/ubuntu/nationalvote-deploy/k8s/

            echo "Updating application image..."
            sudo kubectl set image deployment/nationalvote \
              nationalvote="$IMAGE" \
              -n devops-project

            echo "Waiting for rollout..."
            sudo kubectl rollout status deployment/nationalvote \
              -n devops-project --timeout=180s

            echo "Checking application resources..."
            sudo kubectl get pods -n devops-project
            sudo kubectl get services -n devops-project
