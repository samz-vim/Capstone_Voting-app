name: CD

on:
  repository_dispatch:
    types: [terraform-complete]
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy NationalVote
    runs-on: ubuntu-latest

    env:
      AWS_REGION: eu-north-1
      AWS_PAGER: ""
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

     
     
      - name: Discover Current EC2 Instance
        id: ec2
        shell: bash
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail

          if [[ -z "${AWS_REGION:-}" ]]; then
            echo "::error::AWS_REGION secret is missing."
            exit 1
          fi

          echo "Searching for the current NationalVote EC2 instance..."

          INSTANCE_ID=$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --filters \
              "Name=tag:Project,Values=NationalVote" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)

          if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "None" ]]; then
            echo "::error::No running NationalVote EC2 instance found."
            echo "Run Terraform apply and check the EC2 tags and AWS region."
            exit 1
          fi

          INSTANCE_COUNT=$(wc -w <<< "$INSTANCE_ID")

          if [[ "$INSTANCE_COUNT" -ne 1 ]]; then
            echo "::error::Found multiple running NationalVote instances. Expected exactly one."
            exit 1
          fi

          PUBLIC_IP=$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)

          if [[ -z "$PUBLIC_IP" || "$PUBLIC_IP" == "None" ]]; then
            echo "::error::The current EC2 instance has no public IP."
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "host=$PUBLIC_IP" >> "$GITHUB_OUTPUT"

          echo "EC2 instance discovered successfully."
          echo "Instance ID: $INSTANCE_ID"
          echo "Public IP: $PUBLIC_IP"


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Copy Kubernetes manifests to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "k8s/"
          target: "/home/ubuntu/nationalvote-deploy/"
          overwrite: true

      
      - name: Diagnose EC2 Bootstrap Failure
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          command_timeout: 3m
          script: |
            echo "========== CLOUD-INIT STATUS =========="
            sudo cloud-init status --long || true
      
            echo "========== SCRIPT FILE TYPE =========="
            sudo file /var/lib/cloud/instance/scripts/part-001 || true
      
            echo "========== FIRST 32 BYTES =========="
            sudo od -An -tx1 -N32 /var/lib/cloud/instance/scripts/part-001 || true
      
            echo "========== FIRST LINE WITH HIDDEN CHARACTERS =========="
            sudo head -n 1 /var/lib/cloud/instance/scripts/part-001 | cat -A || true
      
            echo "========== BOOTSTRAP LOG =========="
            sudo tail -n 150 /var/log/nationalvote-bootstrap.log 2>&1 || true
      
            echo "========== CLOUD-INIT OUTPUT =========="
            sudo tail -n 200 /var/log/cloud-init-output.log 2>&1 || true
      
            echo "========== CLOUD-INIT ERROR DETAILS =========="
            sudo sed -n '830,875p' /var/log/cloud-init.log 2>&1 || true
      
            echo "========== INSTALLED COMPONENTS =========="
            command -v kubectl || true
            command -v kubeadm || true
            command -v containerd || true
    
          
      
      - name: Test Docker on existing EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -eu
      
            if ! command -v docker >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y docker.io
            fi
      
            sudo systemctl enable --now docker
            sudo docker --version
            sudo docker run --rm hello-world


      
      - name: Check Docker on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          command_timeout: 1m
          script: |
            set -eu
      
            if ! command -v docker >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y docker.io
            fi
      
            sudo systemctl enable --now docker
            sudo docker --version
            sudo docker run --rm hello-world
                
      
      - name: Wait for EC2 Docker Setup
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -eu
      
            echo "Checking EC2 Docker setup..."
      
            for i in $(seq 1 60); do
              if sudo test -f /var/lib/nationalvote-bootstrap-complete; then
                break
              fi
      
              if [ "$i" -eq 60 ]; then
                echo "ERROR: Docker bootstrap did not complete."
                sudo tail -n 100 /var/log/nationalvote-bootstrap.log || true
                exit 1
              fi
      
              sleep 5
            done
      
            echo "Checking Docker..."
            sudo systemctl is-active docker
            sudo docker --version
      
            echo "EC2 Docker setup is ready."
      
      
      
