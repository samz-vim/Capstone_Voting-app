name: CD

on:
  repository_dispatch:
    types: [terraform-complete]
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy NationalVote
    runs-on: ubuntu-latest

    env:
      AWS_REGION: eu-north-1
      AWS_PAGER: ""
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

     
     
      - name: Discover Current EC2 Instance
        id: ec2
        shell: bash
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail

          if [[ -z "${AWS_REGION:-}" ]]; then
            echo "::error::AWS_REGION secret is missing."
            exit 1
          fi

          echo "Searching for the current NationalVote EC2 instance..."

          INSTANCE_ID=$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --filters \
              "Name=tag:Project,Values=NationalVote" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)

          if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "None" ]]; then
            echo "::error::No running NationalVote EC2 instance found."
            echo "Run Terraform apply and check the EC2 tags and AWS region."
            exit 1
          fi

          INSTANCE_COUNT=$(wc -w <<< "$INSTANCE_ID")

          if [[ "$INSTANCE_COUNT" -ne 1 ]]; then
            echo "::error::Found multiple running NationalVote instances. Expected exactly one."
            exit 1
          fi

          PUBLIC_IP=$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)

          if [[ -z "$PUBLIC_IP" || "$PUBLIC_IP" == "None" ]]; then
            echo "::error::The current EC2 instance has no public IP."
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "host=$PUBLIC_IP" >> "$GITHUB_OUTPUT"

          echo "EC2 instance discovered successfully."
          echo "Instance ID: $INSTANCE_ID"
          echo "Public IP: $PUBLIC_IP"


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Copy Kubernetes manifests to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "k8s/"
          target: "/home/ubuntu/nationalvote-deploy/"
          overwrite: true

      
      - name: Wait for Kubernetes Bootstrap and Diagnose Failures
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            set -eu

            MARKER="/var/lib/nationalvote-bootstrap-complete"
            LOG="/var/log/nationalvote-bootstrap.log"

            echo "Waiting for EC2 bootstrap to complete..."

            for attempt in $(seq 1 120); do
              if sudo test -f "$MARKER"; then
                echo "Bootstrap completed successfully."
                break
              fi

              if [ "$attempt" -eq 120 ]; then
                echo "ERROR: Bootstrap did not complete within 20 minutes."
                echo "========== BOOTSTRAP LOG =========="
                sudo tail -n 150 "$LOG" 2>/dev/null || true

                echo "========== CLOUD-INIT STATUS =========="
                sudo cloud-init status --long 2>&1 || true

                echo "========== CLOUD-INIT OUTPUT =========="
                sudo tail -n 100 /var/log/cloud-init-output.log 2>/dev/null || true

                echo "========== KUBERNETES SERVICES =========="
                sudo systemctl --no-pager --full status containerd kubelet 2>&1 || true

                exit 1
              fi

              sleep 10
            done

            export KUBECONFIG=/home/ubuntu/.kube/config

            echo "Checking Kubernetes nodes..."
            kubectl wait --for=condition=Ready nodes --all --timeout=300s

            echo "Checking cluster pods..."
            kubectl get nodes
            kubectl get pods -A

            echo "Kubernetes cluster is ready."

      
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
            host: ${{ steps.ec2.outputs.host }}
            username: ubuntu
            key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
            script: |
              set -eu
  
              echo "Checking Kubernetes bootstrap..."
              if ! sudo test -f /var/lib/nationalvote-bootstrap-complete; then
                echo "Kubernetes bootstrap is not complete."
                exit 1
              fi
  
              export KUBECONFIG=/home/ubuntu/.kube/config
              kubectl get nodes
            
      - name: Prepare and Verify Kubernetes
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

          script: |
            set -eu

            echo "Waiting for NationalVote bootstrap to finish..."

            ATTEMPTS=120
            COUNT=0

            while ! sudo test -f /var/lib/nationalvote-bootstrap-complete; do
              COUNT=$((COUNT + 1))

              if [ "$COUNT" -ge "$ATTEMPTS" ]; then
                echo "ERROR: Kubernetes bootstrap did not complete."
                echo "Bootstrap log:"
                sudo tail -n 100 /var/log/nationalvote-bootstrap.log || true
                exit 1
              fi

              sleep 10
            done

            echo "Bootstrap completed successfully."

            export KUBECONFIG=/home/ubuntu/.kube/config

            if ! command -v kubectl >/dev/null 2>&1; then
              echo "ERROR: kubectl is not installed or not in PATH."
              exit 1
            fi

            echo "Checking Kubernetes node readiness..."
            kubectl wait \
              --for=condition=Ready \
              nodes --all \
              --timeout=300s

            echo "Checking Kubernetes cluster..."
            kubectl get nodes
            kubectl get pods -A

            echo "Kubernetes cluster is ready for deployment."


