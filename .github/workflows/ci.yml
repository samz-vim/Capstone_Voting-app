name: Voting App CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: voting
          POSTGRES_USER: voting
          POSTGRES_PASSWORD: voting_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voting -d voting"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://voting:voting_test_password@localhost:5432/voting
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        run: pytest -v
      - name: Build Docker image
        run: docker build -t voting-app:${{ github.sha }} .
