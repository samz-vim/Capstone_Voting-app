# Quick reference manifest. Prefer the Helm chart for repeatable deployment.
# Replace the image and password before using this manifest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voting-app
  namespace: voting-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: voting-app
  template:
    metadata:
      labels:
        app: voting-app
    spec:
      containers:
        - name: voting-app
          image: REPLACE_WITH_ECR_REPOSITORY_URL:IMAGE_TAG
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg://voting:CHANGE_ME@voting-postgres:5432/voting"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: voting-app
  namespace: voting-app
spec:
  type: LoadBalancer
  selector:
    app: voting-app
  ports:
    - port: 80
      targetPort: 5000
