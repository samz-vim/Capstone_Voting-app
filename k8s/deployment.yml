apiVersion: apps/v1
kind: Deployment
metadata:
  name: nationalvote
  namespace: devops-project
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nationalvote
  template:
    metadata:
      labels:
        app: nationalvote
    spec:
      containers:
        - name: nationalvote
          image: samzcode/nationalvote:latest
          ports:
            - containerPort: 5000
