apiVersion: apps/v1
kind: Deployment
metadata:
  name: nationalvote
  namespace: {{ .Values.namespace }}
  labels:
    app: nationalvote
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: nationalvote
  template:
    metadata:
      labels:
        app: nationalvote
    spec:
      containers:
        - name: nationalvote
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          env:
          - name: DATABASE_URL
            value: "postgresql+psycopg://nationalvote:tobiloba12345@voting-postgres:5432/nationalvote"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
